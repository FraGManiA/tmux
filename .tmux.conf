# ===================================================================
# General Settings
# ===================================================================

# Change prefix key to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Allow right-click to be handled by terminal (enables direct paste)
unbind -n MouseDown3Pane

# Fix terminal colors without sending color queries (prevents 11;rgb artifacts)
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Increase scrollback buffer history (default is 2000)
set -g history-limit 100000

# Address vim/neovim mode switching delay
set -s escape-time 10

# Start window and pane numbering at 1 (instead of 0)
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# ===================================================================
# Key Bindings
# ===================================================================

# Split panes using | and - (and keep current path)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Quick reload config
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Vim-like pane navigation (Ctrl-a + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Easy window swapping
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# ===================================================================
# Status Bar & Styling (Obsidian Theme)
# ===================================================================

# Standaard statusbalk achtergrond (Obsidian Donkergrijs / Charcoal)
set -g status-style "bg=#1e1e1e,fg=#dcddde"

# Lengte van statusblokken
set -g status-left-length 40
set -g status-right-length 60

# Links: Hostnaam in paars (Obsidian accent)
set -g status-left "#[fg=#1e1e1e,bg=#7f6df2,bold] #H #[fg=#7f6df2,bg=#1e1e1e] "

# Rechts: Datum/Tijd & Sessie in gedempte tinten
set -g status-right "#[fg=#888888,bg=#1e1e1e]%Y-%m-%d %H:%M #[fg=#1e1e1e,bg=#7f6df2,bold] #S "

# Inactieve vensters
setw -g window-status-format "#[fg=#888888,bg=#1e1e1e] #I:#W "

# Actief venster (Obsidian Violet accent met heldere tekst)
setw -g window-status-current-format "#[fg=#ffffff,bg=#7f6df2,bold] #I:#W* "

# Pane randen (Obsidian style split-lines)
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#7f6df2"

# Command line / berichtstijl
set -g message-style "bg=#7f6df2,fg=#ffffff,bold"
